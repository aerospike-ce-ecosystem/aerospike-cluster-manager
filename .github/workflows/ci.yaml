name: CI
# On PR/push: runs API tests (pytest) + UI lint/build (next build) + pre-commit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ui

      - uses: pre-commit/action@v3.0.1

  api:
    name: API Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/

      - name: Format check
        run: uv run ruff format --check src/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  # Backend -> frontend type sync (#165). Project goal 2-7 requires Pydantic
  # models and their TypeScript mirrors to stay in sync; this is the mechanism
  # that enforces it instead of relying on reviewers noticing.
  #
  # Two failure modes, both caught here:
  #  * the committed schema/type artifacts are stale -> `git diff --exit-code`
  #  * a hand-written type in ui/src/lib/types no longer matches the schema ->
  #    the generated parity assertions fail `tsc --noEmit`
  type-sync:
    name: Backend/Frontend Type Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install API dependencies
        run: uv sync
        working-directory: api

      - name: Install UI dependencies
        run: npm ci
        working-directory: ui

      # Regenerates from the live Pydantic models and fails if anything the
      # repo has committed differs. `make generate-types` is the fix.
      - name: Check generated types are current
        run: make generate-types-check

      # The generated parity assertions only bite when the compiler runs.
      - name: Type check (includes schema parity assertions)
        run: npm run type-check
        working-directory: ui

  ui:
    name: UI Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
